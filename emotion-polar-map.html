      <div style="color:#999;margin-bottom:6px;">Categories</div>
      <div id="cat-boxes"></div>
      <div id="cat-actions">
        <button type="button" id="cat-all">All</button>
        <button type="button" id="cat-none">None</button>

    </section>
    </div>
  </aside>

  <div class="tooltip" id="tip"></div>
  <svg id="viz" aria-label="Emotion polar graph"></svg>

  <aside id="spotlight" aria-live="polite">
    <div class="spot-head">

        <button type="button" class="panel-toggle" id="spot-toggle" aria-expanded="true" aria-controls="spotlight-inner">Hide</button>

      </div>
    </div>
    <div id="spotlight-inner" class="spot-inner">
    <h3 id="spot-term"></h3>
    <dl id="spot-meta"></dl>
    <p id="spot-desc"></p>
    </div>
  </aside>

um", "pleasantness": "Low", "description": "A face badly in need of a fist—the blunt German image for irritating, punchable smugness (politer gloss: “slap-worthy face”)."}, {"term": "Fernweh", "origin": "German", "category": "Sadness and Grief", "intensity": "Medium", "energy": "Low", "pleasantness": "Low/Neutral", "description": "Aching for faraway places—**wanderlust** is close, but *Fernweh* can ache for cities and coasts you’ve never even visited (German; “far-sickness”)."}, {"term": "Gigil", "origin": "Filipino (Tagalog)", "category": "Happiness/Joy", "intensity": "Soft", "energy": "Medium", "pleasantness": "High", "description": "The compulsion to pinch or squeeze something irresistibly cute—hands and voice both go a little foolish."}, {"term": "Forelsket", "origin": "Norwegian", "category": "Happiness/Joy", "intensity": "Medium", "energy": "High", "pleasantness": "Very High", "description": "Euphoria of first falling in love (often described as untranslatable in English)."}, {"term": "Retrouvailles", "origin": "French", "category": "Happiness/Joy", "intensity": "Soft", "energy": "Low", "pleasantness": "High", "description": "Joy of meeting someone again after a long separation; sweetness of reunion."}, {"term": "Ras-le-bol", "origin": "French", "category": "Anger, Apathy, and Hatred", "intensity": "Medium", "energy": "Medium", "pleasantness": "Low", "description": "Colloquial “fed up”—accumulated frustration boiling over (literally “bowl full to the brim”)."}, {"term": "Mágoa", "origin": "Portuguese", "category": "Sadness and Grief", "intensity": "Medium", "energy": "Low", "pleasantness": "Low", "description": "Hurt—physical or emotional—often encompassing sorrow, grief, or wounded feelings."}, {"term": "Desabafar", "origin": "Portuguese", "category": "Nonspecific", "intensity": "Medium", "energy": "Medium", "pleasantness": "Neutral", "description": "Needing to vent problems or release distress—talking, moving, or acting it out to feel relief."}, {"term": "Ap egory": "Confusion", "intensity": "Medium", "energy": "Medium", "pleasantness": "Neutral", "description": "An idea plausible only with too much alcohol in your veins—literally “schnapps idea.” English gets close with pipe dream, not a lexicon black hole."}, {"term": "Slampadato", "origin": "Italian", "category": "Happiness/Joy", "intensity": "Medium", "energy": "Low", "pleasantness": "Neutral", "description": "That UV-victim tint—being hooked on tanning-booth bronze (Italian slang)."}, {"term": "Feestvarken", "origin": "Dutch", "category": "Social Connection", "intensity": "Medium", "energy": "High", "pleasantness": "High", "description": "“Party pig”—the guest in whose honor a celebration is thrown."}, {"term": "Linslus", "origin": "Swedish", "category": "Social Comparison", "intensity": "Medium", "energy": "Medium", "pleasantness": "Neutral", "description": "Someone who always wants to be in front of the camera (attention-seeker around lenses)."}, {"term": "Hè hè", "origin": "Dutch", "category": "Happiness/Contentment", "intensity": "Soft", "energy": "Low", "pleasantness": "High", "description": "Expressive sigh of relief after a long or tiring day."}, {"term": "Sonder", "origin": "English (coined, Dictionary of Obscure Sorrows)", "category": "Social Connection", "intensity": "Medium", "energy": "Low", "pleasantness": "Neutral", "description": "John Koenig: realization that each passerby has an inner life as vivid and complex as your own."}, {"term": "Watashiato", "origin": "English (coined, Dictionary of Obscure Sorrows)", "category": "Social Connection", "intensity": "Soft", "energy": "Low", "pleasantness": "Neutral", "description": "John Koenig: curiosity about what impact you have had on others’ lives—wondering which forgotten moments changed their stories."}, {"term": "Etterath", "origin": "English (coined, Dictionary of Obscure Sorrows)", "category": "Sadness and Grief", "intensity": "Medium", "energy": "Low", "pleasantness": "Neutral/Low", "description": "John Koenig: hollow emptiness after a huge ordeal ends—relief mixed with missing the mission that structured you."}, {"term": "Sisu", "origin": "Finnish", "category": "Fear/Anxiety", "intensity": "Medium", "energy": "Medium", "pleasantness": "Neutral", "description": "Grit to keep going through hardship without drama—stubborn courage when endurance matters more than comfort."}, {"term": "Ubuntu", "origin": "Nguni Bantu", "category": "Social Connection", "intensity": "Medium", "energy": "Low", "pleasantness": "High", "description": "Humanity toward others; the moral sense that personhood is woven from community (“I am because we are”)."}, {"term": "Voorpret", "origin": "Dutch", "category": "Happiness/Joy", "intensity": "Medium", "energy": "Medium", "pleasantness": "High", "description": "Pleasure taken in anticipating a forthcoming event—pre-fun before the party begins."}, {"term": "Iktsuarpok", "origin": "Inuktitut", "category": "Anxiety", "intensity": "Soft", "energy": "Medium", "pleasantness": "Neutral", "description": "Waiting for a guest who’s due any minute—the itch to keep going outside (or to the window) to see if they’ve arrived yet (Inuit/Inuktitut)."}, {"term": "Fremdscham", "origin": "German", "category": "Shame/Confusion", "intensity": "Medium", "energy": "Medium", "pleasantness": "Low", "description": "Vicarious embarrassment—wincing on someone else’s behalf (German also **Fremdschämen**; close cousins: Finnish **myötähäpeä**, Spanish *pena ajena*)."}, {"term": "Gökotta", "origin": "Swedish", "category": "Peace/Solitude", "intensity": "Soft", "energy": "Low", "pleasantness": "High", "description": "Waking early to go outside and listen to birdsong—dawn-quiet as a mood."}, {"term": "Weltschmerz", "origin": "German", "category": "Sadness and Grief", "intensity": "Medium", "energy": "Low", "pleasantness": "Low", "description": "“World grief”—romantic, gloomy weariness at how the world is; often glossed as the ache of comfortable youth staring at life (German; literally world-pain)."}, {"term": "Han", "origin": "Korean", "category": "Sadness and Grief", "intensity": "Intense", "energy": "Low", "pleasantness": "Very Low", "description": "Cultural complex of sorrow, resentment, and unfinished grief from collective injustice—often glossed as national heartache."}, {"term": "Greng jai", "origin": "Thai", "category": "Social Connection", "intensity": "Soft", "energy": "Low", "pleasantness": "Neutral", "description": "Reluctance to ask a favor for fear of burdening someone—a small pang of guilt about imposing, or making them lose face (also written greng-jai)."}, {"term": "Zhaghzhagh", "origin": "Persian (Farsi)", "category": "Fear/Anxiety", "intensity": "Soft", "energy": "High", "pleasantness": "Low", "description": "Teeth chattering—from bitter cold, from rage, or from nerves—a sharp bodily signal of strain."}, {"term": "Verschlimmbesserung", "origin": "German", "category": "Confusion", "intensity": "Medium", "energy": "Medium", "pleasantness": "Low", "description": "Making something worse while trying to improve it—failed fix that adds new problems."}, {"term": "Yugen", "origin": "Japanese", "category": "Happiness/Joy", "intensity": "Soft", "energy": "Low", "pleasantness": "High", "description": "Aesthetic sense of subtle, profound depth and mystery—beauty too deep for plain statement."}, {"term": "Shinrin-yoku", "origin": "Japanese", "category": "Peace/Solitude", "intensity": "Soft", "energy": "Low", "pleasantness": "High", "description": "“Forest bathing”—immersing in woodland atmosphere for restorative calm (often counted as an untranslatable wellness idea)."}, {"term": "Kummerspeck", "origin": "German", "category": "Sadness and Grief", "intensity": "Soft", "energy": "Low", "pleasantness": "Low", "description": "Extra padding from stress-eating—literally “grief bacon” when sorrow or upheaval sends you back to the fridge."}, {"term": "Sobremesa", "origin": "Spanish", "category": "Social Connection", "intensity": "Soft", "energy": "Low", "pleasantness": "High", "description": "After the plates are cleared, the easy talk and coffee that keep everyone at the table (Spanish)."}, {"term": "Mångata", "origin": "Swedish", "category": "Peace/Solitude", "intensity": "Soft", "energy": "Very Low", "pleasantness": "High", "description": "Moonlight’s rippled road across water—a still, enchanted nightscape feeling."}, {"term": "Uitwaaien", "origin": "Dutch", "category": "Peace/Solitude", "intensity": "Soft", "energy": "Low", "pleasantness": "High", "description": "Literally to walk in the wind; figuratively, heading into open air or countryside to blow the cobwebs away and clear your head."}, {"term": "Tingo", "origin": "Rapa Nui", "category": "Nonspecific", "intensity": "Soft", "energy": "Low", "pleasantness": "Neutral", "description": "To end up owning something from a friend’s house by borrowing it bit by bit—a habit of soft appropriation (widely cited from Easter Island / Pascuense word lists)."}, {"term": "Alharaca", "origin": "Spanish (from Arabic al-haraka, ‘movement’)", "category": "Anger/Boundaries", "intensity": "Intense", "energy": "High", "pleasantness": "Low", "description": "A loud, almost violent show of emotion over a small thing—wild gestures, dramatic hurt, or explosive excitement out of proportion to the trigger."}, {"term": "Mokita", "origin": "Kivila (Papua New Guinea)", "category": "Social Connection", "intensity": "Soft", "energy": "Low", "pleasantness": "Neutral", "description": "What everyone knows but nobody says—the shared hush around an obvious truth (elephant-in-the-room as social convention)."}, {"term": "Geborgenheit", "origin": "German", "category": "Happiness, Contentment, and Joy", "intensity": "Soft", "energy": "Low", "pleasantness": "Very High", "description": "Feeling utterly safe and held—as if harm can’t reach you—usually tied to a trusted person, home, or refuge."}, {"term": "Gunnen", "origin": "Dutch", "category": "Happiness/Joy", "intensity": "Soft", "energy": "Low", "pleasantness": "High", "description": "To wish someone a pleasure you might miss yourself—generous sympathy that says they should have the good thing without envy."}, {"term": "Shemomedjamo", "origin": "Georgian", "category": "Happiness, Contentment, and Joy", "intensity": "Medium", "energy": "Low", "pleasantness": "High", "description": "You’re full, but the food is too good—you keep eating anyway. Often glossed as “I accidentally ate the whole thing” in English listicles about Georgian."}, {"term": "Orenda", "origin": "Wyandot/Huron (Iroquoian languages)", "category": "Happiness/Joy", "intensity": "Medium", "energy": "Medium", "pleasantness": "High", "description": "A traditional sense of mind-and-will as a tangible power you can exert to shift events—human agency made almost spiritual, set against sheer fatalism."}, {"term": "Gümüş servi", "origin": "Turkish", "category": "Peace/Solitude", "intensity": "Soft", "energy": "Very Low", "pleasantness": "High", "description": "Moonlight shimmering on water—a still, bright image-word in Turkish (often repeated in English as gumusservi)."}, {"term": "Koi no yokan", "origin": "Japanese", "category": "Happiness/Joy", "intensity": "Soft", "energy": "Medium", "pleasantness": "Very High", "description": "On first meeting someone, the sense that the two of you will fall in love—not infatuation yet, but the quiet certainty it’s heading that way."}, {"term": "Mencolek", "origin": "Indonesian", "category": "Nonspecific", "intensity": "Soft", "energy": "Low", "pleasantness": "High", "description": "The tap on someone’s far shoulder so they look the wrong way—a playful prank gesture, not really an emotion word."}, {"term": "Zeg", "origin": "Georgian", "category": "Nonspecific", "intensity": "Soft", "energy": "Low", "pleasantness": "Neutral", "description": "The day after tomorrow (Georgian). English has the rare **overmorrow**—this is the word people actually use."}, {"term": "Faamiti", "origin": "Samoan", "category": "Nonspecific", "intensity": "Soft", "energy": "Low", "pleasantness": "Neutral", "description": "Sucking air past the lips to make a small squeak that gets a dog’s or child’s attention—sound-gesture more than an emotion."}, {"term": "Bakku-shan", "origin": "Japanese", "category": "Social Comparison", "intensity": "Soft", "energy": "Low", "pleasantness": "Low", "description": "Slang for someone who seems striking from behind but underwhelming from the front—a look-based letdown."}, {"term": "Bilita Mpash", "origin": "Bantu (loanword in several languages)", "category": "Happiness/Joy", "intensity": "Soft", "energy": "Low", "pleasantness": "Very High", "description": "An exceptionally good dream—the opposite of a nightmare; blissful sleep-fantasy rather than merely “pleasant.”"}, {"term": "Cavoli riscaldati", "origin": "Italian", "category": "Sadness and Grief", "intensity": "Medium", "energy": "Low", "pleasantness": "Low", "description": "“Reheated cabbage”—trying to revive a romance that’s already failed; a relationship that shouldn’t be warmed up again."}, {"term": "Cotisuelto", "origin": "Caribbean Spanish", "category": "Nonspecific", "intensity": "Soft", "energy": "Low", "pleasantness": "Neutral", "description": "Someone who wears a dress shirt untucked over the trousers—fashion habit, not a mood."}, {"term": "Fisselig", "origin": "German", "category": "Anxiety", "intensity": "Medium", "energy": "High", "pleasantness": "Low", "description": "Jangled and on edge to the point you can’t settle—frazzled, scattered, unable to finish what you started."}, {"term": "Myötähäpeä", "origin": "Finnish", "category": "Shame/Confusion", "intensity": "Medium", "energy": "Medium", "pleasantness": "Low", "description": "Secondhand embarrassment—cringing with someone through their awkward moment (akin to German Fremdscham)."}, {"term": "Frühjahrsmüdigkeit", "origin": "German", "category": "Apathy/Depression", "intensity": "Medium", "energy": "Low", "pleasantness": "Low", "description": "“Spring tiredness”—low mood, fatigue, or heaviness as the days lengthen; sometimes contrasted with winter SAD as the seasons flip."}, {"term": "Honigkuchenpferd", "origin": "German", "category": "Happiness/Joy", "intensity": "Soft", "energy": "Medium", "pleasantness": "Very High", "description": "Literally “honey-cake horse”—grinning so wide you can’t stop, like the Cheshire cat (broad, sticky smile)."}, {"term": "Hygge", "origin": "Danish", "category": "Social Connection", "intensity": "Soft", "energy": "Low", "pleasantness": "High", "description": "The noun Danes reach for when things feel cozy and convivial—overlap with nice, comfy, and warm company; pairs with adjective hyggelig. Marketing abroad hypes it more than the semantics warrant."}, {"term": "Kaelling", "origin": "Danish", "category": "Nonspecific", "intensity": "Medium", "energy": "High", "pleasantness": "Low", "description": "An insulting stereotype of a woman scolding children in public—loaded slang, closer to caricature than affect."}, {"term": "Layogenic", "origin": "Tagalog", "category": "Social Comparison", "intensity": "Soft", "energy": "Low", "pleasantness": "Low", "description": "Attractive from a distance but messy up close—like a Monet that dissolves when you step nearer."}, {"term": "L'esprit de l'escalier", "origin": "French", "category": "Confusion", "intensity": "Medium", "energy": "Medium", "pleasantness": "Low", "description": "“Staircase wit”—the perfect reply you think of only after you’ve left, halfway down the stairs."}, {"term": "Luftmensch", "origin": "Yiddish", "category": "Nonspecific", "intensity": "Soft", "energy": "Low", "pleasantness": "Neutral", "description": "An impractical dreamer “made of air”—big visions, little grip on money or worldly detail."}, {"term": "Packesel", "origin": "German", "category": "Nonspecific", "intensity": "Soft", "energy": "Medium", "pleasantness": "Low", "description": "The pack-mule of the group—stuck carrying everyone else’s bags; literally “pack donkey.”"}, {"term": "Pålegg", "origin": "Norwegian", "category": "Nonspecific", "intensity": "Soft", "energy": "Low", "pleasantness": "Neutral", "description": "Catch-all for anything you might lay on bread—cheese, jam, fish, chocolate spread; sandwich vocabulary."}, {"term": "Pana Po'o", "origin": "Hawaiian", "category": "Confusion", "intensity": "Soft", "energy": "Low", "pleasantness": "Neutral", "description": "Scratching your head to jog a slippery memory—where did I leave those keys?"}, {"term": "Pelinti", "origin": "Buli (Ghana)", "category": "Nonspecific", "intensity": "Soft", "energy": "Medium", "pleasantness": "Low", "description": "Shuttling scorching food around your mouth with little hisses—cooling pizza or stew on the tongue."}, {"term": "Razbliuto", "origin": "English listicle fiction (not Russian)", "category": "Sadness and Grief", "intensity": "Soft", "energy": "Low", "pleasantness": "Neutral", "description": "Alleged “Russian” for loving-not love—traced by William Safire to a chain (Moore → Rheingold → Bryan) back to *The Man from U.N.C.L.E.* scriptwriters. Kept as cautionary glossary junk, not living lexicon."}, {"term": "Schlemiel", "origin": "Yiddish", "category": "Nonspecific", "intensity": "Soft", "energy": "Medium", "pleasantness": "Low", "description": "The chronic klutz who knocks over the coffee—the one who makes the mess (paired with schlimazel)."}, {"term": "Schlimazel", "origin": "Yiddish", "category": "Nonspecific", "intensity": "Soft", "energy": "Low", "pleasantness": "Low", "description": "The one the coffee lands on—always catching others’ spills; born under a dripping cloud (paired with schlemiel)."}, {"term": "Seigneur-terraces", "origin": "French", "category": "Social Comparison", "intensity": "Soft", "energy": "Low", "pleasantness": "Low", "description": "Café lingerers who camp at a table forever on one espresso—a jab at cheap throne-sitting."}, {"term": "Sentak bangun", "origin": "Indonesian", "category": "Anxiety", "intensity": "Soft", "energy": "High", "pleasantness": "Low", "description": "Jolting awake with a start—heart suddenly loud in a dark room."}, {"term": "Shouganai", "origin": "Japanese", "category": "Peace/Solitude", "intensity": "Soft", "energy": "Low", "pleasantness": "Neutral", "description": "“It can’t be helped”—resigned acceptance so you don’t burn fuel raging at the fixed facts."}, {"term": "Treppenwitz", "origin": "German", "category": "Confusion", "intensity": "Medium", "energy": "Medium", "pleasantness": "Low", "description": "The comeback you think of on the staircase leaving—the German twin of *l’esprit de l’escalier*."}, {"term": "Tsundoku", "origin": "Japanese", "category": "Nonspecific", "intensity": "Soft", "energy": "Low", "pleasantness": "Neutral", "description": "Buying books (or magazines) faster than you read them—tsunami of unread stacks on the nightstand."}, {"term": "Uffda", "origin": "Scandinavian (esp. Norwegian American English)", "category": "Social Connection", "intensity": "Soft", "energy": "Low", "pleasantness": "Neutral", "description": "Sympathetic wince—ouch plus I’m sorry that happened; staple of Upper Midwest US speech from Scandinavian settlers."}, {"term": "Vybafnout", "origin": "Czech", "category": "Nonspecific", "intensity": "Soft", "energy": "Medium", "pleasantness": "High", "description": "Leap out and shout boo—the Czech cousin of “made you jump.”"}, {"term": "Yuputka", "origin": "Ulwa", "category": "Fear/Anxiety", "intensity": "Soft", "energy": "Medium", "pleasantness": "Low", "description": "Creepy-crawly feeling on the skin when phantom bugs scamper—made for night walks in the brush."}, {"term": "Utepils", "origin": "Norwegian", "category": "Nonspecific", "intensity": "Soft", "energy": "Low", "pleasantness": "High", "description": "A compound noun (not a quirky verb): ute “outside” + pils “pilsner”—beer enjoyed outdoors in good weather. Transparent in Norwegian; listicles oversell it."}, {"term": "Goya", "origin": "Urdu (from Persian)", "category": "Nonspecific", "intensity": "Soft", "energy": "Low", "pleasantness": "Neutral", "description": "Often mistranslated as “suspension of disbelief in storytelling”; in ordinary use it means “it is said,” “reportedly,” “they say”—framing hearsay, not a special narrative trance."}, {"term": "Çekoslovakyalılaştıramadıklarımızdanmışsınız", "origin": "Turkish", "category": "Nonspecific", "intensity": "Soft", "energy": "Low", "pleasantness": "Neutral", "description": "A poster-child agglutinated form glossed as “you are reportedly among those we couldn’t turn Czechoslovakian”—really syntax welded into one token. Shows Turkish morphology, not a single ineffable concept."}]</script>

    const RAW = JSON.parse(document.getElementById("emotion-data").textContent);

      const t = String(s).toLowerCase();
      const parts = t.split(/[/\s]+/).filter(Boolean);
      const scoreWord = (w) => {
        if (w.includes("very") && w.includes("high")) return 1;
        if (w.includes("very") && w.includes("low")) return -1;
        if (w.includes("high")) return 0.85;
        if (w.includes("low")) return -0.85;
        if (w.includes("neutral")) return 0;
        if (w.includes("bittersweet")) return 0;
        if (w.includes("conflicted")) return 0;
        return 0;
      };
      if (parts.length <= 1) return scoreWord(t);
      return parts.reduce((a, w) => a + scoreWord(w), 0) / parts.length;
    }

    function scoreEnergy(s) {
      if (!s) return 0;

      const parts = t.split(/[/\s]+/).filter(Boolean);
      const scoreWord = (w) => {
        if (w.includes("very") && w.includes("high")) return 1;
        if (w.includes("very") && w.includes("low")) return -1;

        if (w.includes("medium")) return 0.35;

        return 0;
      };
      if (parts.length <= 1) return scoreWord(t);
      return parts.reduce((a, w) => a + scoreWord(w), 0) / parts.length;
    }

    function intensityRadius(intensity) {
      const s = String(intensity || "").toLowerCase();
      if (s.includes("intense")) return 0.86;
      if (s.includes("soft") && s.includes("medium")) return 0.42;
      if (s.includes("soft")) return 0.34;
      if (s.includes("medium")) return 0.58;
      if (s.includes("variable")) return 0.5;
      if (s.includes("low")) return 0.24;
      return 0.5;
    }

    const categories = [...new Set(RAW.map((d) => d.category))].sort();
    const nCat = categories.length;
    const catIndex = Object.fromEntries(categories.map((c, i) => [c, i]));
    const color = d3.scaleOrdinal(d3.quantize(d3.interpolateSinebow, nCat + 1));

    const byTerm = d3.group(RAW, (d) => d.term.trim().toLowerCase());

    const TWO_PI = Math.PI * 2;
    const nodes = RAW.map((d, i) => {
      const ci = catIndex[d.category];
      const sector = TWO_PI / nCat;
      const mid = (ci + 0.5) * sector - Math.PI / 2;
      const ep = scorePleasantness(d.pleasantness);
      const ee = scoreEnergy(d.energy);
      const jitter = (ep * 0.22 + ee * 0.18) * sector * 0.45;
      const angle = mid + jitter + Math.sin(i * 12.9898) * 0.03 * sector;
      const r = intensityRadius(d.intensity);
      const sisters = byTerm.get(d.term.trim().toLowerCase()) || [];
      const distinctCats = new Set(sisters.map((x) => x.category));
      let labelText = d.term;
      if (distinctCats.size > 1) {
        const head = d.category.split(",")[0].trim();
        const short = head.length > 14 ? head.slice(0, 13) + "…" : head;
        labelText = d.term + " · " + short;
      }
      return {
        id: i,
        term: d.term,
        labelText,
        category: d.category,
        intensity: d.intensity,
        origin: d.origin,
        description: d.description,
        rNorm: r,
        theta: angle,
        sector,
        catI: ci,
      };
    });

    const W = window.innerWidth;
    const H = window.innerHeight;
    const cx = W / 2;
    const cy = H / 2;
    const R_chart = Math.min(W, H) * 0.42;
    const R = R_chart * 0.86;
    const catBox = document.getElementById("cat-boxes");

    nodes.forEach((d) => {
      d.tx = cx + d.rNorm * R * Math.cos(d.theta);
      d.ty = cy + d.rNorm * R * Math.sin(d.theta);
      d.x = d.tx;
      d.y = d.ty;
    });

    function buildCategoryLinks(subset) {
      const byCat = d3.group(subset, (d) => d.category);
      const L = [];
      byCat.forEach((list) => {
        const sorted = [...list].sort((a, b) => a.theta - b.theta || a.rNorm - b.rNorm);
        const n = sorted.length;
        for (let i = 0; i < n; i++) {
          const a = sorted[i];
          const b = sorted[(i + 1) % n];
          if (a.id !== b.id) L.push({ source: a.id, target: b.id });
          if (n > 2) {
            const c = sorted[(i + 2) % n];
            if (a.id !== c.id) L.push({ source: a.id, target: c.id });
          }
        }
      });
      return L;
    }

    function normVisible(d) {
      return d.rNorm >= ui.rMin && d.rNorm <= ui.rMax;
    }

    function catVisible(d) {
      return !!ui.cat[d.category];
    }

    function searchMatch(d) {
      const q = ui.search.trim().toLowerCase();
      if (!q) return false;
      return String(d.term).toLowerCase().includes(q);
    }

    function filteredNodes() {
      return nodes.filter((d) => catVisible(d) && normVisible(d));
    }

    const svg = d3.select("#viz").attr("width", W).attr("height", H);
    const gRoot = svg.append("g");
    gRoot
      .append("rect")
      .attr("class", "zoom-bg")
      .attr("width", W)
      .attr("height", H)
      .attr("x", 0)
      .attr("y", 0);

    function legendTextBox(gParent, x, y, label, strokeColor, meta) {
      const padX = 7;
      const padY = 4;
      const g = gParent.append("g").attr("transform", `translate(${x},${y})`);
      if (meta && meta.category) g.attr("class", "legend-category-box");
      const text = g
        .append("text")
        .attr("class", strokeColor ? "legend-box-text" : "legend-box-text ring-tier")
        .attr("text-anchor", "middle")
        .attr("dominant-baseline", "middle")
        .attr("pointer-events", "none")
        .text(label);
      const bb = text.node().getBBox();
      const rx = bb.x - padX;
      const ry = bb.y - padY;
      const rw = bb.width + 2 * padX;
      const rh = bb.height + 2 * padY;
      g.insert("rect", "text")
        .attr("class", "legend-box-bg")
        .attr("x", rx)
        .attr("y", ry)
        .attr("width", rw)
        .attr("height", rh)
        .attr("rx", 5)
        .attr("ry", 5)
        .attr("stroke", strokeColor || "#5c6478")
        .attr("pointer-events", "none");
      if (meta && meta.category) {
        g.append("rect")
          .attr("class", "legend-hit")
          .attr("x", rx)
          .attr("y", ry)
          .attr("width", rw)
          .attr("height", rh)
          .attr("rx", 5)
          .attr("ry", 5)
          .attr("fill", "transparent")
          .attr("pointer-events", "all")
          .attr("title", "Show or hide: " + meta.category)
          .on("click", (e) => {
            e.stopPropagation();
            const cat = meta.category;
            ui.cat[cat] = !ui.cat[cat];
            const inp = [...catBox.querySelectorAll('input[type="checkbox"]')].find(
              (el) => el.dataset.cat === cat
            );
            if (inp) inp.checked = ui.cat[cat];
            applyGraph();
          });
      }
      return g;
    }

    const legendCategoryState = [];

    const ringLabels = [
      { r: 0.34, t: "Soft" },
      { r: 0.58, t: "Medium" },
      { r: 0.86, t: "Intense" },
    ];
    const legendG = gRoot.append("g").attr("class", "legend");
    ringLabels.forEach((ring) => {
      legendG
        .append("circle")
        .attr("cx", cx)
        .attr("cy", cy)
        .attr("r", ring.r * R)
        .attr("fill", "none")
        .attr("stroke", "#333")
        .attr("stroke-dasharray", "4 6");
      const lx = cx + ring.r * R + 6;
      const ly = cy - ring.r * R + 4;
      legendTextBox(legendG, lx, ly, ring.t, null, null);
    });

    const lr = R + Math.max(52, R_chart * 0.13);
    categories.forEach((c, i) => {
      const a0 = (i / nCat) * TWO_PI - Math.PI / 2;
      const a1 = ((i + 1) / nCat) * TWO_PI - Math.PI / 2;
      const arc = d3.path();
      arc.moveTo(cx, cy);
      arc.arc(cx, cy, R + 14, a0, a1);
      arc.closePath();
      const wedge = legendG
        .append("path")
        .attr("d", arc.toString())
        .attr("fill", color(c))
        .attr("fill-opacity", 0.07)
        .attr("stroke", "none")
        .attr("pointer-events", "none");
      const mid = (a0 + a1) / 2;
      const label = c.length > 22 ? c.slice(0, 20) + "…" : c;
      const labelG = legendTextBox(
        legendG,
        cx + lr * Math.cos(mid),
        cy + lr * Math.sin(mid),
        label,
        color(c),
        { category: c }
      );
      legendCategoryState.push({ category: c, wedge, labelG });
    });

    function refreshLegendCategoryStyles() {
      legendCategoryState.forEach(({ category, wedge, labelG }) => {
        const on = ui.cat[category];
        wedge.attr("fill-opacity", on ? 0.07 : 0.02);
        labelG
          .select(".legend-box-bg")
          .attr("opacity", on ? 1 : 0.4)
          .attr("stroke-opacity", on ? 1 : 0.35);
        labelG.select(".legend-box-text").attr("opacity", on ? 1 : 0.48);
      });
    }

    const gLinks = gRoot.append("g").attr("class", "links");
    const gNodes = gRoot.append("g").attr("class", "nodes");

    const tip = d3.select("#tip");

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function labelOpacity(d) {
      if (ui.labelsAlways) return 1;
      if (searchMatch(d)) return 1;
      return ui.zoomK >= 1.35 ? 1 : 0;
    }

    function updateLabelVisibility() {
      gNodes.selectAll(".node text").attr("opacity", (d) => labelOpacity(d));
    }

    let sim = null;
    let linkSel = null;
    let nodeSel = null;

    function positionNodeLabels() {
      if (!nodeSel || nodeSel.empty()) return;
      const z = ui.zoomK;
      const baseR = 10 + Math.min(7, (z - 1) * 4);
      nodeSel.each(function (d) {
        const ang = Math.atan2(d.y - cy, d.x - cx);
        const c = Math.cos(ang);
        const s = Math.sin(ang);
        const px = -s;
        const py = c;
        const tang = (((d.id * 31) % 13) - 6) * 1.25;
        const dx = c * baseR + px * tang;
        const dy = s * baseR + py * tang;
        d3.select(this)
          .select("text")
          .attr("dx", dx)
          .attr("dy", dy)
          .attr("text-anchor", "middle")
          .attr("dominant-baseline", "middle");
      });
    }

    function ticked() {
      linkSel
        .attr("x1", (d) => d.source.x)
        .attr("y1", (d) => d.source.y)
        .attr("x2", (d) => d.target.x)
        .attr("y2", (d) => d.target.y);
      nodeSel.attr("transform", (d) => `translate(${d.x},${d.y})`);
      positionNodeLabels();
    }

    const dragBehav = d3
      .drag()
      .on("start", (ev, d) => {
        if (!sim) return;
        sim.alphaTarget(0.35).restart();
        d.fx = d.x;
        d.fy = d.y;
      })
      .on("drag", (ev, d) => {
        const t = d3.zoomTransform(svg.node());
        const [px, py] = d3.pointer(ev, gRoot.node());
        d.fx = (px - t.x) / t.k;
        d.fy = (py - t.y) / t.k;
      })
      .on("end", (ev, d) => {
        if (!sim) return;
        sim.alphaTarget(0);
        d.fx = null;
        d.fy = null;
      });

    function applyGraph() {
      const vis = filteredNodes();
      const links = buildCategoryLinks(vis);

      vis.forEach((d) => {
        if (d.x == null || Number.isNaN(d.x)) {
          d.x = d.tx;
          d.y = d.ty;
        }
      });

      if (sim) {
        sim.stop();
        sim = null;
      }

      linkSel = gLinks
        .selectAll("line")
        .data(links, (e) => {
          const s = typeof e.source === "object" ? e.source.id : e.source;
          const t = typeof e.target === "object" ? e.target.id : e.target;
          return s + "-" + t;
        })
        .join("line")
        .attr("class", "link");

      nodeSel = gNodes
        .selectAll("g")
        .data(vis, (d) => d.id)
        .join(
          (enter) => {
            const g = enter.append("g").attr("class", "node");
            g.append("circle").attr("r", 5);
            g.append("text").attr("dx", 0).attr("dy", 0);
            return g;
          },
          (update) => update,
          (exit) => exit.remove()
        );

      nodeSel
        .select("circle")
        .attr("fill", (d) => color(d.category));

      nodeSel
        .select("text")
        .text((d) => {
          const t = d.labelText || d.term;
          return t.length > 22 ? t.slice(0, 20) + "…" : t;
        })
        .attr("opacity", (d) => labelOpacity(d));

      nodeSel.classed("highlight", (d) => searchMatch(d));

      nodeSel.call(dragBehav);
      nodeSel
        .on("mouseenter", (ev, d) => {
          tip.style("display", "block")
            .html(
              "<h3>" +
                escapeHtml(d.term) +
                '</h3><div class="meta">' +
                escapeHtml(d.category) +
                " · " +
                escapeHtml(d.intensity) +
                (d.origin ? " · " + escapeHtml(d.origin) : "") +
                '</div><div class="desc">' +
                escapeHtml((d.description || "").slice(0, 420)) +
                ((d.description || "").length > 420 ? "…" : "") +
                "</div>"
            );
        })
        .on("mousemove", (ev) => {
          tip
            .style("left", ev.clientX + 14 + "px")
            .style("top", ev.clientY + 14 + "px");
        })
        .on("mouseleave", () => tip.style("display", "none"));

      if (vis.length === 0) {
        linkSel.style("display", "none");
        refreshEdgesVisibility();
        updateLabelVisibility();
        refreshLegendCategoryStyles();
        return;
      }

      linkSel.style("display", null);

      sim = d3
        .forceSimulation(vis)
        .force(
          "link",
          d3
            .forceLink(links)
            .id((d) => d.id)
            .distance(32)
            .strength(0.35)
        )
        .force("charge", d3.forceManyBody().strength(-48))
        .force("collision", d3.forceCollide().radius(13).strength(0.92))
        .force("x", d3.forceX((d) => d.tx).strength(0.4))
        .force("y", d3.forceY((d) => d.ty).strength(0.4))
        .on("tick", ticked);

      refreshEdgesVisibility();
      updateLabelVisibility();
      positionNodeLabels();
      refreshLegendCategoryStyles();
    }

    function refreshEdgesVisibility() {
      const on = ui.edges;
      linkSel.classed("hidden", !on);
    }

    function syncSlidersFromUi() {
      const toPct = (v) => Math.round(((v - 0.1) / 0.85) * 100);
      document.getElementById("r-min").value = String(toPct(ui.rMin));
      document.getElementById("r-max").value = String(toPct(ui.rMax));
      document.getElementById("r-min-v").textContent = ui.rMin.toFixed(2);
      document.getElementById("r-max-v").textContent = ui.rMax.toFixed(2);
    }

    function readSliders() {
      const rv = (id) => {
        const v = +document.getElementById(id).value;
        return 0.1 + (v / 100) * 0.85;
      };
      let a = rv("r-min");
      let b = rv("r-max");
      if (a > b) [a, b] = [b, a];
      ui.rMin = a;
      ui.rMax = b;
      syncSlidersFromUi();
    }

    categories.forEach((c) => {
      const row = document.createElement("label");
      row.className = "row";
      const inp = document.createElement("input");
      inp.type = "checkbox";
      inp.checked = true;
      inp.dataset.cat = c;
      const span = document.createElement("span");
      span.style.flex = "1";
      span.textContent = c.length > 36 ? c.slice(0, 34) + "…" : c;
      span.title = c;
      row.appendChild(inp);
      row.appendChild(span);
      catBox.appendChild(row);
    });

    catBox.addEventListener("change", (ev) => {
      const t = ev.target;
      if (!(t instanceof HTMLInputElement) || t.type !== "checkbox") return;
      const name = t.dataset.cat;
      if (!name) return;
      ui.cat[name] = t.checked;
      applyGraph();
    });

    document.getElementById("cat-all").addEventListener("click", () => {
      catBox.querySelectorAll('input[type="checkbox"]').forEach((el) => {
        el.checked = true;
        const n = el.dataset.cat;
        if (n) ui.cat[n] = true;
      });
      applyGraph();
    });

    document.getElementById("cat-none").addEventListener("click", () => {
      catBox.querySelectorAll('input[type="checkbox"]').forEach((el) => {
        el.checked = false;
        const n = el.dataset.cat;
        if (n) ui.cat[n] = false;
      });
      applyGraph();
    });

    document.getElementById("opt-edges").addEventListener("change", (ev) => {
      ui.edges = ev.target.checked;
      refreshEdgesVisibility();
    });

    document.getElementById("opt-labels").addEventListener("change", (ev) => {
      ui.labelsAlways = ev.target.checked;
      updateLabelVisibility();
      nodeSel && nodeSel.select("text").attr("opacity", (d) => labelOpacity(d));
    });

    ["r-min", "r-max"].forEach((id) =>
      document.getElementById(id).addEventListener("input", () => {
        readSliders();
        applyGraph();
      })
    );

    document.getElementById("search").addEventListener("input", (ev) => {
      ui.search = ev.target.value;
      if (nodeSel)
        nodeSel.classed("highlight", (d) => searchMatch(d));
      updateLabelVisibility();
      if (nodeSel) nodeSel.select("text").attr("opacity", (d) => labelOpacity(d));
    });

    syncSlidersFromUi();
    applyGraph();

    const zoom = d3
      .zoom()
      .scaleExtent([0.12, 10])
      .filter((ev) => {
        if (ev.type === "wheel") return true;
        if (ev.button !== 0) return false;
        return ev.target.classList.contains("zoom-bg");
      })
      .on("zoom", (ev) => {
        ui.zoomK = ev.transform.k;
        gRoot.attr("transform", ev.transform);
        updateLabelVisibility();
        positionNodeLabels();
        if (nodeSel)
          nodeSel.select("text").attr("opacity", (d) => labelOpacity(d));
      });

    svg.call(zoom).call(zoom.transform, d3.zoomIdentity);

    document.getElementById("zoom-in").addEventListener("click", () =>
      svg.transition().duration(200).call(zoom.scaleBy, 1.25)
    );
    document.getElementById("zoom-out").addEventListener("click", () =>
      svg.transition().duration(200).call(zoom.scaleBy, 0.8)
    );
    document.getElementById("reset-view").addEventListener("click", () =>
      svg.transition().duration(300).call(zoom.transform, d3.zoomIdentity)
    );

    function pickRandomIndex(n) {
      if (n <= 0) return 0;
      if (typeof crypto !== "undefined" && crypto.getRandomValues) {
        const buf = new Uint32Array(1);
        crypto.getRandomValues(buf);
        return buf[0] % n;
      }
      return Math.floor(Math.random() * n);
    }

    function renderSpotlight(d) {
      document.getElementById("spot-term").textContent = d.term || "";
      const origin = d.origin != null && d.origin !== "" ? d.origin : "English";
      const meta = document.getElementById("spot-meta");
      meta.innerHTML =
        "<dt>Origin</dt><dd>" +
        escapeHtml(origin) +
        "</dd><dt>Category</dt><dd>" +
        escapeHtml(d.category || "") +
        "</dd><dt>Intensity</dt><dd>" +
        escapeHtml(d.intensity || "") +
        "</dd><dt>Energy</dt><dd>" +
        escapeHtml(d.energy || "—") +
        "</dd><dt>Pleasantness</dt><dd>" +
        escapeHtml(d.pleasantness || "—") +
        "</dd>";
      document.getElementById("spot-desc").textContent = d.description || "";
    }

    function refreshSpotlight() {
      if (!RAW.length) return;
      renderSpotlight(RAW[pickRandomIndex(RAW.length)]);
    }

    function syncPanelToggleButtons() {
      const c = document.getElementById("controls");
      const ct = document.getElementById("controls-toggle");
      const cCollapsed = c.classList.contains("collapsed");
      ct.setAttribute("aria-expanded", cCollapsed ? "false" : "true");
      ct.textContent = cCollapsed ? "Show" : "Hide";

      const s = document.getElementById("spotlight");
      const st = document.getElementById("spot-toggle");
      const sCollapsed = s.classList.contains("collapsed");
      st.setAttribute("aria-expanded", sCollapsed ? "false" : "true");
      st.textContent = sCollapsed ? "Show" : "Hide";
    }

    try {
      if (localStorage.getItem("emotionPolar.controlsCollapsed") === "1")
        document.getElementById("controls").classList.add("collapsed");
      if (localStorage.getItem("emotionPolar.spotlightCollapsed") === "1")
        document.getElementById("spotlight").classList.add("collapsed");
    } catch (e) {}

    document.getElementById("controls-toggle").addEventListener("click", () => {
      const el = document.getElementById("controls");
      el.classList.toggle("collapsed");
      try {
        localStorage.setItem(
          "emotionPolar.controlsCollapsed",
          el.classList.contains("collapsed") ? "1" : "0"
        );
      } catch (e) {}
      syncPanelToggleButtons();
    });
    document.getElementById("spot-toggle").addEventListener("click", () => {
      const el = document.getElementById("spotlight");
      el.classList.toggle("collapsed");
      try {
        localStorage.setItem(
          "emotionPolar.spotlightCollapsed",
          el.classList.contains("collapsed") ? "1" : "0"
        );
      } catch (e) {}
      syncPanelToggleButtons();
    });

    refreshSpotlight();
    syncPanelToggleButtons();
    document
      .getElementById("spot-refresh")
      .addEventListener("click", refreshSpotlight);

    window.addEventListener("resize", () => location.reload());
  })();
  </script>
</body>
</html>
